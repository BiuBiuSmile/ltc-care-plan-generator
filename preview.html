<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5f8fd6" />
  <meta name="description" content="支援電腦與手機的長照服務項目核定單，可快速選擇身分別、失能等級與服務項目並計算核定額度。" />
  <title>服務項目核定工具</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=30" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">居督行動工具</p>
        <h1>服務項目核定單工具</h1>
      </div>
      <button id="resetBtn" class="ghost-button" type="button">清空</button>
    </header>

    <main>
      <section class="card hero-card" aria-labelledby="basic-title">
        <div class="section-heading">
          <div>
            <p class="step">STEP 1</p>
            <h2 id="basic-title">基本核定資料</h2>
          </div>

        </div>

        <div class="basic-fields">
        <div class="basic-field">
        <label class="field-label" for="identitySelect">身分別</label>
        <select id="identitySelect" class="input-control">
          <option value="general">第三類（一般戶）</option>
          <option value="middleLow">第二類（中低收入戶）</option>
          <option value="low">第一類（長照低收入戶）</option>
        </select>

        </div>
        <div class="basic-field">
        <label class="field-label" for="levelSelect">失能等級</label>
        <select id="levelSelect" class="input-control">
          <option value="2">第2級｜10,020 元</option>
          <option value="3">第3級｜15,460 元</option>
          <option value="4">第4級｜18,580 元</option>
          <option value="5">第5級｜24,100 元</option>
          <option value="6">第6級｜28,070 元</option>
          <option value="7">第7級｜32,090 元</option>
          <option value="8">第8級｜36,180 元</option>
        </select>

        </div>
        <div class="summary-grid" aria-live="polite">
          <div class="summary-box">
            <span>每月核定額度</span>
            <strong id="budgetAmount">10,020</strong>
            <small>元 / 月</small>
          </div>
          <div class="summary-box">
            <span>部分負擔</span>
            <strong id="copayRate">16%</strong>
            <small id="copayLabel">一般戶</small>
          </div>
        </div>
        </div>
      </section>

      <section class="card service-section" aria-labelledby="service-title">
        <div class="section-heading">
          <div>
            <p class="step">STEP 2</p>
            <h2 id="service-title">加入核定服務</h2>
          </div>
          <span id="selectedCount" class="count-badge">0 項</span>
        </div>

        <label class="field-label" for="serviceSearch">搜尋服務代碼或名稱</label>
        <input id="serviceSearch" class="input-control" type="search" placeholder="例如：BA02、備餐、陪伴" autocomplete="off" />

        <div class="quick-filter" role="group" aria-label="服務類別篩選">
          <button type="button" class="filter-chip active" data-filter="all">全部</button>
          <button type="button" class="filter-chip" data-filter="care">照顧服務</button>
          <button type="button" class="filter-chip" data-filter="professional">專業服務</button>
          <button type="button" class="filter-chip" data-filter="daycare">日照／社區</button>
        </div>

        <div id="serviceList" class="service-list" aria-live="polite"></div>
      </section>

      <div class="review-column">
      <section id="step3Section" class="card" aria-labelledby="approved-title">
        <div class="section-heading step3-heading">
          <div>
            <p class="step">STEP 3</p>
            <h2 id="approved-title">本月核定項目</h2>
          </div>
          <button id="clearItemsBtn" class="text-button" type="button">清除項目</button>
        </div>

        <button id="overviewBtn" class="overview-button" type="button">
          <span class="overview-button-icon" aria-hidden="true">▦</span>
          <span>
            <strong>產出服務項目總覽</strong>
            <small>另開新分頁查看每週與單次服務</small>
          </span>
          <span class="overview-button-arrow" aria-hidden="true">›</span>
        </button>

        <div id="approvedList" class="approved-list empty-state">
          尚未加入服務項目
        </div>
      </section>

      <section id="resultPanel" class="result-panel" aria-label="核定計算結果，點一下可跳到 Step 3" role="button" tabindex="0">
        <div class="result-row">
          <span>預估每月服務總額</span>
          <strong><span id="serviceTotal">0</span> 元</strong>
        </div>
        <div class="result-row">
          <span>預估部分負擔</span>
          <strong><span id="copayTotal">0</span> 元</strong>
        </div>
        <div class="result-row usage-row">
          <span>額度使用率</span>
          <strong id="budgetUsage" class="usage-rate">0%</strong>
        </div>
        <div class="result-divider"></div>
        <div class="result-row large">
          <span>剩餘額度</span>
          <strong id="remainingAmount">10,020 元</strong>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="budgetProgress" class="progress-bar" style="width: 0%"></div>
        </div>
        <p id="budgetHint" class="budget-hint">目前尚未使用核定額度。</p>
        <p class="result-panel-tip">點一下此區可快速查看 Step 3 本月核定項目</p>
      </section>

      </div>

      <p class="footer-note">
        本工具為行動查詢與試算用途；資料僅在目前頁面暫存，不會保留上一筆操作，也不會上傳個案資料。
      </p>
    </main>
    <div class="creator-signature" aria-label="作者 BiuBiuSmile">by BiuBiuSmile</div>
  </div>

  <template id="serviceCardTemplate">
    <article class="service-card">
      <button class="service-main" type="button">
        <div class="service-code"></div>
        <div class="service-copy">
          <h3 class="service-name"></h3>
          <p class="service-price"></p>
        </div>
        <span class="add-mark">＋</span>
      </button>
    </article>
  </template>

  <script src="app.js?v=30"></script>
</body>
</html>
